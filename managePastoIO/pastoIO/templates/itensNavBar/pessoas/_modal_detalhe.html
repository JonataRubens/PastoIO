<div class="modal-header">
  <h5 class="modal-title">Detalhes da pessoa — {{ object.nome }}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
</div>

<div class="modal-body">
  <div class="info-box p-3">
    <div class="row g-3">
      <div class="col-md-6"><strong>Nome:</strong> {{ object.nome }}</div>
      <div class="col-md-6"><strong>Função:</strong> {{ object.get_funcao_display|default:"—" }}</div>
      <div class="col-md-6"><strong>Telefone:</strong> {{ object.telefone|default:"—" }}</div>
      <div class="col-md-6"><strong>Organização:</strong> {{ object.organizacao|default:"—" }}</div>
      <div class="col-12">
        <strong>Observações:</strong>
        <div class="break-anywhere">{{ object.observacoes|default:"—" }}</div>
      </div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
</div>
